{{- if and .Values.routes.enabled .Values.routes.rules }}
{{- $root := . }}

{{- range $rule := .Values.routes.rules }}

{{- $gateway := (include "microservice.gatewayByName" (dict "name" $rule.gateway "gateways" $root.Values.routes.gateways) | fromYaml) }}
{{- $fullName := printf "%s-%s" (include "microservice.fullname" $root) $rule.name }}

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "microservice.labels" $root | nindent 4 }}

spec:
  parentRefs:
  - name: {{ $gateway.gateway.name }}
    namespace: {{ $gateway.gateway.namespace | default $root.Release.Namespace }}

  {{- if $rule.hostnames }}
  hostnames:
  {{- range $rule.hostnames }}
  - {{ . | quote }}
  {{- end }}
  {{- end }}

  rules:
  - matches:
    {{- range $rule.matches }}
    - path:
        type: {{ .type | default "PathPrefix" }}
        value: {{ .path | quote }}
    {{- end }}

    {{- $filters := list }}

    {{- $m := $rule.middlewares | default dict }}
    {{- if $m.stripPath }}
    {{- $filters = append $filters (dict
        "type" "URLRewrite"
        "urlRewrite" (dict
          "path" (dict
            "type" "ReplacePrefixMatch"
            "replacePrefixMatch" "/"
          )
        )
      )
    }}
    {{- end }}

    {{- if include "microservice.hasChainedMiddlewares" $rule }}
    {{- $filters = append $filters (dict
        "type" "ExtensionRef"
        "extensionRef" (dict
          "group" "traefik.io"
          "kind" "Middleware"
          "name" (printf "%s-%s-chain" (include "microservice.fullname" $root) $rule.name)
        )
      )
    }}
    {{- end }}

    {{- if gt (len $filters) 0 }}
    filters:
      {{- toYaml $filters | nindent 6 }}
    {{- end }}

    backendRefs:
    - name: {{ include "microservice.fullname" $root }}
      port: {{ $root.Values.service.port }}

{{- end }}
{{- end }}