{{- if and .Values.webhook.enabled .Values.webhook.mutatingWebhooks }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kubernetes-operator.fullname" . }}-mutating-webhook
  labels:
    {{- include "kubernetes-operator.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kubernetes-operator.fullname" . }}-serving-cert
webhooks:
  {{- range .Values.webhook.mutatingWebhooks }}
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "kubernetes-operator.fullname" $ }}-webhook
        namespace: {{ $.Release.Namespace }}
        path: {{ .path }}
    failurePolicy: {{ .failurePolicy | default "Fail" }}
    name: {{ .name }}
    rules:
      {{- toYaml .rules | nindent 6 }}
    sideEffects: None
  {{- end }}
{{- end }}
