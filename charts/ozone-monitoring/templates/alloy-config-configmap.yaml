{{/*
  Custom Alloy ConfigMap with dynamic service URLs.
  Replaces the inline configMap.content in values.yaml so that
  Prometheus and Loki endpoints are derived from the Helm release
  name and namespace — no manual URL edits needed.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  # Must match the Alloy chart's fullname so the DaemonSet finds this ConfigMap
  name: {{ .Release.Name }}-alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.alloy: |
    // Node-level host metrics (replaces prometheus-node-exporter) - mainly for storage
    prometheus.exporter.unix "node" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
      rootfs_path = "/host/root"
    }

    prometheus.scrape "node" {
      targets = prometheus.exporter.unix.node.targets
      forward_to = [prometheus.remote_write.local.receiver]
    }

    // TODO: Remove if actual cluster and WITHOUT Cilium (all 3 blocks below — add_node, kubelet, cadvisor)
    prometheus.relabel "add_node" {
      forward_to = [prometheus.remote_write.local.receiver]

      rule {
        action       = "replace"
        target_label = "node"
        replacement  = env("NODE_NAME")
      }
    }

    prometheus.scrape "kubelet" {
      scheme     = "https"
      tls_config {
        insecure_skip_verify = true
      }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      targets = [{
        "__address__" = "localhost:10250",
        "__metrics_path__" = "/metrics",
      }]
      forward_to = [prometheus.relabel.add_node.receiver]
    }

    prometheus.scrape "cadvisor" {
      scheme     = "https"
      tls_config {
        insecure_skip_verify = true
      }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      targets = [{
        "__address__" = "localhost:10250",
        "__metrics_path__" = "/metrics/cadvisor",
      }]
      forward_to = [prometheus.relabel.add_node.receiver]
    }

    // Prometheus remote_write URL is derived from the Helm release name and namespace
    prometheus.remote_write "local" {
      endpoint {
        url = "http://{{ .Release.Name }}-kube-prometheus-prometheus.{{ .Release.Namespace }}.svc:9090/api/v1/write"
      }
    }

    // --- Log collection ---

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets    = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.tenant.receiver]
    }

    loki.process "tenant" {
      stage.static_labels {
        values = {
          tenant_id = env("TENANT_ID"),
        }
      }

      // Extract log level from common patterns (case-insensitive)
      stage.regex {
        expression = "(?i)(?P<level>\\b(?:FATAL|PANIC|CRITICAL|EMERG|ERROR|ERR|WARN|WARNING|INFO|INF|DEBUG|DBG|TRACE|TRC)\\b)"
      }

      // Normalize extracted level — regex is case-insensitive so we
      // get mixed-case captures. Replace stages map all variants to
      // a single lowercase value.
      stage.replace {
        expression = "(?i)^(warning|warn)$"
        source     = "level"
        replace    = "warn"
      }

      stage.replace {
        expression = "(?i)^(err|error)$"
        source     = "level"
        replace    = "error"
      }

      stage.replace {
        expression = "(?i)^(fatal|panic|critical|emerg)$"
        source     = "level"
        replace    = "critical"
      }

      stage.replace {
        expression = "(?i)^(inf|info)$"
        source     = "level"
        replace    = "info"
      }

      stage.replace {
        expression = "(?i)^(dbg|debug)$"
        source     = "level"
        replace    = "debug"
      }

      stage.replace {
        expression = "(?i)^(trc|trace)$"
        source     = "level"
        replace    = "trace"
      }

      stage.labels {
        values = {
          level = "",
        }
      }

      forward_to = [loki.write.local.receiver]
    }

    // Loki write URL is derived from the Helm release name and namespace
    loki.write "local" {
      endpoint {
        url = "http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc:3100/loki/api/v1/push"
      }
    }
