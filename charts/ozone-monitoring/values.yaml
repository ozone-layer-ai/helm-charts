# =============================================================================
# Ozone Monitoring — Unified Values
# =============================================================================
#
# Install with any release name and namespace:
#
#   helm install <release> ./ozone-monitoring -n <namespace> --create-namespace
#
# All internal service URLs (Prometheus, Loki) are dynamically derived from
# the Helm release name and namespace via templated ConfigMaps — no manual
# URL edits needed.
#
# The bundled dashboard references datasource UID "prometheus", which matches
# the default Prometheus datasource provisioned by kube-prometheus-stack.
# =============================================================================

kube-prometheus-stack:
  # Disabled because Alloy replaces it via prometheus.exporter.unix
  nodeExporter:
    enabled: false

  kube-state-metrics:
    enabled: true

  grafana:
    enabled: true
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
      # Datasource sidecar picks up ConfigMaps with grafana_datasource: "1" label.
      # The Loki datasource is provisioned via templates/grafana-loki-datasource.yaml
      # with a dynamic URL derived from the Helm release name and namespace.
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"

  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      enableRemoteWriteReceiver: true
  kubelet:
    enabled: true

alloy:
  alloy:
    # Use our custom ConfigMap template (templates/alloy-config-configmap.yaml)
    # instead of inline content, so Prometheus and Loki URLs are dynamically
    # derived from the Helm release name and namespace.
    configMap:
      # Disabled — we provide our own ConfigMap (templates/alloy-config-configmap.yaml)
      # with dynamic Prometheus and Loki URLs derived from the Helm release name/namespace.
      create: false

    # TODO: Remove if actual cluster and WITHOUT Cilium (only used by the add_node relabel block)
    extraEnv:
      - name: TENANT_ID
        value: "1234567-dev-cluster"
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    mounts:
      extra:
        - name: procfs
          mountPath: /host/proc
          readOnly: true
        - name: sysfs
          mountPath: /host/sys
          readOnly: true
        - name: rootfs
          mountPath: /host/root
          readOnly: true
        - name: varlog
          mountPath: /var/log
          readOnly: true

  controller:
    type: daemonset
    # TODO: Remove if actual cluster and WITHOUT Cilium (only needed to reach kubelet via localhost)
    hostNetwork: true
    # TODO: Remove if actual cluster and WITHOUT Cilium (only needed because of hostNetwork)
    dnsPolicy: ClusterFirstWithHostNet
    volumes:
      extra:
        - name: procfs
          hostPath:
            path: /proc
        - name: sysfs
          hostPath:
            path: /sys
        - name: rootfs
          hostPath:
            path: /
        - name: varlog
          hostPath:
            path: /var/log

# =============================================================================
# Loki — SingleBinary mode for dev
# =============================================================================
loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

  singleBinary:
    replicas: 1

  # Disable distributed components (not needed in SingleBinary mode)
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # Disable gateway (no nginx proxy needed for dev)
  gateway:
    enabled: false

  # Disable caches (no memcached needed for dev)
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
