apiVersion: v2
name: ozone-monitoring
description: >-
  Umbrella chart for AI Datacenter Kubernetes monitoring.
  Deploys Prometheus, Grafana, Alloy, and a pre-built dashboard in one shot.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: "82.2.0"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: alloy
    version: "1.6.0"
    repository: "https://grafana.github.io/helm-charts"
